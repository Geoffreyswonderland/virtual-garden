<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東籬小園｜虛擬園藝活動雛形</title>
<meta name="description" content="結合詩詞與過程測量的虛擬園藝活動雛形：移植、澆水、採菊，並記錄每個動作後的放鬆程度。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=3">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="虛擬庭園"></canvas>

<header id="hud" hidden>
  <span id="step"></span>
  <p id="instruction" aria-live="polite"></p>
  <button id="sound" type="button" aria-pressed="true">聲音：開</button>
</header>

<section id="title" class="overlay">
  <div class="card intro">
    <p class="eyebrow">虛擬園藝活動・展示雛形</p>
    <h1>東籬小園</h1>
    <p class="lede">在一座安靜的小園裡，種下一株幼苗、為它澆水，再到籬笆旁採一朵菊花。每做完一件事，會請你說說此刻的感受。</p>
    <ul class="facts">
      <li>約 5 分鐘・建議戴耳機</li>
      <li>拖曳畫面可以環顧四周</li>
      <li>這是展示雛形，資料只留在這台裝置上，不會上傳</li>
    </ul>
    <p id="load-error" class="error" hidden></p>
    <button id="start" class="primary" type="button" disabled>載入中…</button>
  </div>
</section>

<aside id="poem-box" aria-live="polite" hidden></aside>

<section id="panel" class="overlay bottom" hidden>
  <div class="card" id="panel-card"></div>
</section>

<section id="result" class="overlay" hidden>
  <div class="card wide">
    <p class="eyebrow">你的療癒歷程</p>
    <h2>每一個動作之後的你</h2>
    <p class="lede">傳統研究只在活動前後各問一次；這條時間軸記錄了活動「過程中」的變化。</p>
    <div id="timeline" class="chart"></div>
    <div id="post-scores"></div>
    <div class="row">
      <button id="download" class="primary" type="button">下載紀錄（CSV）</button>
      <button id="restart" type="button">再體驗一次</button>
    </div>
    <p class="fine">示意題目改寫自知覺恢復量表的概念，正式研究需使用經驗證的中文版量表。</p>
  </div>
</section>

<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
